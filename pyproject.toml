[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "tool-using-research-agent"
version = "1.0.0"
description = "A bounded tool-using research agent that searches, reads, verifies, cites, and self-terminates."
requires-python = ">=3.11"

dependencies = [
    "groq",
    "httpx",
    "trafilatura",
    "python-dotenv",
    "pydantic",
    "PyYAML",
    "rich",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"